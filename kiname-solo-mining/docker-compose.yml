version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kiname-solo-mining_app_1
      APP_PORT: 8501

  app:
    # REEMPLAZA EL HASH DE ABAJO POR EL TUYO REAL
    image: kiname01/solo-mining:1.3@sha256:1d58d7644666890269941a910f46b6c86f7bce629277b4c29386a18d70bc9ce3
    ports:
      - "0.0.0.0:8557:8557" # <-- NUEVO: Expone la API REST a la red local
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
