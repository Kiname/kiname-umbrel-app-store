version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kiname-solo-mining_app_1
      APP_PORT: 8501

  app:
    # REEMPLAZA EL HASH DE ABAJO POR EL TUYO REAL
    image: kiname01/solo-mining:1.5.9@sha256:6005558fe8baf1f8fae413a39ee3528a061858d9febe8c95819726cb04b13f7e
    ports:
      - "0.0.0.0:8557:8557" # <-- NUEVO: Expone la API REST a la red local
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
