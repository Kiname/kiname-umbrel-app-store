      APP_HOST: kiname-solo-mining_app_1
      APP_PORT: 8501

  app:
    
    image: kiname01/solo-mining:1.7.8@sha256:fdcae0eab36eb36bcb76bebcd3bbee690334273777859023171a51023040c79b
    ports:
      - "0.0.0.0:8557:8557" # <-- NUEVO: Expone la API REST a la red local
