version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kiname-solo-mining_app_1
      APP_PORT: 8501

  app:
    # REEMPLAZA EL HASH DE ABAJO POR EL TUYO REAL
    image: kiname01/solo-mining:1.3.8@sha256:be1c76c953c3b1609f91bc340fda232bcd527985d7d3c0ee68d8b802d0491227
    ports:
      - "0.0.0.0:8557:8557" # <-- NUEVO: Expone la API REST a la red local
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
